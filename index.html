<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#011e39" />
    <title>Výškový profil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen">
      <div class="map-area" aria-hidden="true">
        <div class="scale-bar">
          <span>0</span>
          <div class="scale-bar__line"></div>
          <span>50 km</span>
        </div>

        <div class="map-route"></div>

        <div class="map-controls">
          <button type="button" class="map-btn map-btn--layers" aria-label="Vrstvy mapy">
            <span class="map-btn__icon map-btn__icon--layers" aria-hidden="true">
              <img src="assets/map-controls/layers.svg" width="24" height="24" alt="" decoding="async" />
            </span>
          </button>
          <button type="button" class="map-btn map-btn--compass" aria-label="Kompas a poloha">
            <span class="map-btn__icon map-btn__icon--compass" aria-hidden="true">
              <img class="map-btn__compass-symbol" src="assets/map-controls/compass-symbol.svg" alt="" decoding="async" />
              <img class="map-btn__compass-inner" src="assets/map-controls/compass-icon.svg" alt="" decoding="async" />
            </span>
          </button>
        </div>

        <div class="user-dot" aria-hidden="true">
          <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
            <circle cx="13" cy="13" r="8" fill="#1a6cff" stroke="#fff" stroke-width="3" />
          </svg>
        </div>
      </div>

      <section class="bottom-sheet" aria-label="Statistiky trasy">
        <div class="sheet-drag" aria-hidden="true">
          <span class="sheet-drag-handle"></span>
        </div>
        <div class="sheet-actions">
          <button type="button" class="sheet-icon-btn" aria-label="Zavřít">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g transform="translate(6.0494 6.0494)">
                <path
                  fill="currentColor"
                  fill-opacity="0.6"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M5.95059 4.53638L1.70857 0.294352C1.31524 -0.09897 0.68426 -0.096789 0.293735 0.293735C-0.0995117 0.686982 -0.0965131 1.3177 0.294352 1.70857L4.53638 5.95059L0.294352 10.1926C-0.09897 10.5859 -0.096789 11.2169 0.293735 11.6074C0.686982 12.0007 1.3177 11.9977 1.70857 11.6068L5.95059 7.3648L10.1926 11.6068C10.5859 12.0001 11.2169 11.998 11.6074 11.6074C12.0007 11.2142 11.9977 10.5835 11.6068 10.1926L7.3648 5.95059L11.6068 1.70857C12.0001 1.31524 11.998 0.68426 11.6074 0.293735C11.2142 -0.0995117 10.5835 -0.0965131 10.1926 0.294352L5.95059 4.53638Z"
                />
              </g>
            </svg>
          </button>
        </div>

        <div class="sheet-header">
          <h1 class="sheet-title">150 km</h1>
          <p class="sheet-sub">12:45 h</p>
        </div>

        <div class="info-grid">
          <div class="info-grid-default">
            <div class="info-item">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 14l5-5 5 5H7z" />
              </svg>
              <span>1600 m n.m.</span>
            </div>
            <div class="info-item">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 10l5 5 5-5H7z" />
              </svg>
              <span>100 m n.m.</span>
            </div>
            <div class="info-item">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z" />
              </svg>
              <span>4400 m</span>
            </div>
            <div class="info-item">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z" />
              </svg>
              <span>4200 m</span>
            </div>
          </div>
          <div class="info-grid-scrub" aria-hidden="true">
            <div class="info-scrub-row info-scrub-row--line1" role="group">
              <span class="info-scrub-time"></span>
              <span class="info-scrub-sep" aria-hidden="true">•</span>
              <span class="info-scrub-dist"></span>
              <span class="info-scrub-sep" aria-hidden="true">•</span>
              <span class="info-scrub-elev"></span>
              <span class="info-scrub-sep" aria-hidden="true">•</span>
              <span class="info-scrub-grade-wrap">
                <svg class="info-scrub-grade-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    class="info-scrub-grade-arrow info-scrub-grade-arrow--up"
                    d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"
                  />
                  <path
                    class="info-scrub-grade-arrow info-scrub-grade-arrow--down"
                    d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z"
                  />
                </svg>
                <span class="info-scrub-grade"></span>
              </span>
            </div>
            <p class="info-scrub-row info-scrub-row--surface">
              <span class="info-scrub-surface-icon info-scrub-surface-icon--unpaved" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" fill="none">
                  <path d="M0 4H16" stroke="#99ADFF" stroke-width="8" stroke-linejoin="bevel" />
                  <path
                    d="M0 4H16"
                    stroke="#0033FF"
                    stroke-width="4"
                    stroke-linejoin="bevel"
                    stroke-dasharray="6 4"
                  />
                </svg>
              </span>
              <span class="info-scrub-surface-icon info-scrub-surface-icon--paved" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" fill="none">
                  <path d="M0 4H16" stroke="#0033FF" stroke-width="8" stroke-linejoin="bevel" />
                  <path
                    d="M0 4H16"
                    stroke="#99ADFF"
                    stroke-width="4"
                    stroke-linejoin="bevel"
                    stroke-dasharray="6 4"
                  />
                </svg>
              </span>
              <span class="info-scrub-surface-text"></span>
            </p>
            <p class="info-scrub-row info-scrub-row--way">
              <span class="info-scrub-way-icon info-scrub-way-icon--pesina" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" fill="none">
                  <path d="M0 4H16" stroke="#EBE5D5" stroke-width="8" stroke-linejoin="bevel" />
                  <path
                    d="M0 4H16"
                    stroke="#837B62"
                    stroke-width="4"
                    stroke-linejoin="bevel"
                    stroke-dasharray="2 2"
                  />
                </svg>
              </span>
              <span class="info-scrub-way-icon info-scrub-way-icon--chodnik" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" fill="none">
                  <path d="M0 4H16" stroke="#ECECF1" stroke-width="8" stroke-linejoin="bevel" />
                  <path d="M0 4H16" stroke="#BEBCBA" stroke-width="4" stroke-linejoin="bevel" />
                </svg>
              </span>
              <span class="info-scrub-way-text"></span>
            </p>
          </div>
        </div>

        <div class="profile-wrap">
          <div
            class="profile-chart"
            role="img"
            aria-label="Výškový profil trasy, přibližení a posun dvěma prsty, výběr bodu jedním prstem"
            title="Jeden prst: bod na profilu; dva prsty: zoom a posun. Myš: posun při držení Shift."
          ></div>
          <div class="profile-y-labels">
            <span>2000 m</span>
            <span>1000 m</span>
            <span>0 m</span>
          </div>
          <div class="profile-x-labels">
            <span>50 km</span>
            <span>100 km</span>
            <span>150 km</span>
          </div>
        </div>

        <div class="home-indicator" aria-hidden="true"></div>
      </section>
    </div>
    <script src="route-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
